version: "3.9"

services:
  app:
    build: .
    container_name: task_manager_fastapi_app
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasksdb
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
    networks:
      - task_manager_fastapi_network

  db:
    image: postgres:16
    container_name: task_manager_fastapi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasksdb
    volumes:
      - task_manager_fastapi_postgres_data:/var/lib/postgresql/data
    networks:
      - task_manager_fastapi_network

volumes:
  task_manager_fastapi_postgres_data:


networks:
  task_manager_fastapi_network:
    driver: bridge
