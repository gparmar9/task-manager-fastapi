services:
  app:
    build: .
    container_name: task_manager_fastapi_app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - task_manager_fastapi_network

  frontend:
    build: ./frontend
    container_name: task_manager_fastapi_frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - task_manager_fastapi_network

  db:
    image: postgres:16
    container_name: task_manager_fastapi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - task_manager_fastapi_postgres_data:/var/lib/postgresql/data
    networks:
      - task_manager_fastapi_network

volumes:
  task_manager_fastapi_postgres_data:


networks:
  task_manager_fastapi_network:
    driver: bridge
